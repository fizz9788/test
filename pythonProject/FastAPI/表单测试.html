<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户信息提交</title>
    <!-- 简单样式，让页面更美观 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-item {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #409eff;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #337ecc;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #f0f9ff;
            border: 1px solid #b3d8ff;
            color: #1989fa;
            display: block;
        }
        .error {
            background-color: #fff2f2;
            border: 1px solid #ffccc7;
            color: #f56c6c;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>用户信息提交</h2>
        <!-- 表单 -->
        <form id="userForm">
            <div class="form-item">
                <label for="id">用户ID：</label>
                <input type="number" id="id" name="id" required placeholder="请输入数字ID">
            </div>
            <div class="form-item">
                <label for="name">姓名：</label>
                <input type="text" id="name" name="name" required placeholder="请输入姓名">
            </div>
            <div class="form-item">
                <label for="age">年龄：</label>
                <input type="number" id="age" name="age" required placeholder="请输入年龄">
            </div>
            <div class="form-item">
                <label for="sex">性别：</label>
                <input type="text" id="sex" name="sex" required placeholder="男/女">
            </div>
            <button type="submit">提交</button>
        </form>
        <!-- 结果展示区域 -->
        <div id="result" class="result"></div>
    </div>

    <script>
        // 获取表单和结果区域
        const form = document.getElementById('userForm');
        const resultDiv = document.getElementById('result');

        // 表单提交事件
        form.addEventListener('submit', async (e) => {
            // 阻止表单默认提交行为
            e.preventDefault();

            // 收集表单数据
            const formData = new FormData(form);

            try {
                // 调用FastAPI接口
                const response = await fetch('http://127.0.0.1:8010/create_user1', {
                    method: 'POST',
                    body: formData,  // 表单数据格式（和Form()参数匹配）
                    headers: {
                        // 注意：FormData会自动设置Content-Type，无需手动加
                    }
                });

                // 解析响应数据
                const data = await response.json();

                // 展示成功结果
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <strong>提交成功！</strong><br>
                    ID：${data.id}<br>
                    姓名：${data.name}<br>
                    年龄：${data.age}<br>
                    性别：${data.sex}
                `;
            } catch (error) {
                // 展示错误信息
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>提交失败！</strong> 错误信息：${error.message}`;
                console.error('请求错误：', error);
            }
        });
    </script>
</body>
</html>
